name: mutation

# Mutation testing with PIT (./gradlew pitest). A full run takes 10-15 minutes, so it is not part of the normal build:
# run it by hand (Actions -> mutation -> Run workflow) or let the weekly schedule do it. Scheduled runs always start
# from scratch, so the score is an honest measure of the current tests.
on:
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Reuse the PIT history of the previous run (quicker; only changed code and tests are re-examined)'
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC

jobs:
  pitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore PIT history
        if: ${{ inputs.incremental }}
        uses: actions/cache@v4
        with:
          path: .gradle/pitest-history.bin
          key: pitest-history-${{ github.run_id }}
          restore-keys: pitest-history-
      - name: Mutation testing
        run: ./gradlew pitest
      - name: Summary
        if: always()
        run: python3 .github/scripts/pit-summary.py build/reports/pitest >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest/
          if-no-files-found: warn
