plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building an application
    id 'application'

    // jacoco code coverage
    id 'jacoco'

    // intellij!
    id 'idea'

    // mutation testing; explicit `./gradlew pitest` only, not part of `build`/`check`
    id 'info.solidsoft.pitest' version '1.19.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.5')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // property-based tests; its own JUnit Platform engine runs next to Jupiter's
    testImplementation 'net.jqwik:jqwik:1.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Code coverage (JaCoCo). `./gradlew test` writes the HTML/XML report to build/reports/jacoco/test/, and `check`
// (so `build`) fails when coverage drops below the thresholds further down.
jacoco {
    toolVersion = '0.8.13'
}

// Coverage thresholds: a floor a point or two under what the tests achieve (measured with this tree: see the
// README's Testing section), so a regression fails the build but a single new untested line does not. They are
// enforced per top-level package, plus one overall rule, as part of `check`. `project` is `project.App`, the command
// line front end: its main() and System.exit paths are driven by a few smoke tests only, hence the lower floor.
def coverageFloors = [
        physical  : [classes: 'com/darchan/physical/**',   line: 0.97, branch: 0.97],
        behavioral: [classes: 'com/darchan/behavioral/**', line: 0.98, branch: 0.97],
        diag      : [classes: 'com/darchan/diag/**',       line: 0.97, branch: 0.95],
        cosim     : [classes: 'com/darchan/cosim/**',      line: 0.98, branch: 0.98],
        project   : [classes: 'project/**',                line: 0.60, branch: 0.60],
]

// Tests tagged "slow" (e.g. the 8080EXM instruction exerciser, ~24 billion emulated cycles) are left out of
// the normal build; run them with ./gradlew slowTest
test {
    useJUnitPlatform {
        excludeTags 'slow'
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.register('slowTest', Test) {
    description = 'Runs the long-running tests tagged "slow".'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
    }
    shouldRunAfter test
}

tasks.named('jacocoTestCoverageVerification') {
    description = 'Fails if overall line or branch coverage is below the floor.'
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.96
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

coverageFloors.each { name, floor ->
    def verify = tasks.register("jacocoVerify${name.capitalize()}", JacocoCoverageVerification) {
        group = 'verification'
        description = "Fails if ${name} line coverage is below ${floor.line} or branch coverage below ${floor.branch}."
        dependsOn test
        executionData(tasks.named('test').get())
        sourceDirectories.setFrom(sourceSets.main.allJava.srcDirs)
        classDirectories.setFrom(files(sourceSets.main.output.classesDirs).asFileTree.matching {
            include floor.classes
        })
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = floor.line as BigDecimal
                }
                limit {
                    counter = 'BRANCH'
                    value = 'COVEREDRATIO'
                    minimum = floor.branch as BigDecimal
                }
            }
        }
    }
    tasks.named('check') {
        dependsOn verify
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Define the main class for the application
application {
    mainClass = 'project.App'
}

// Mutation testing (PIT): `./gradlew pitest`, reports in build/reports/pitest/. Deliberately NOT wired into
// `check`/`build` (a full run takes several minutes); the weekly/manual .github/workflows/mutation.yml runs it.
pitest {
    // 1.22.1 is the last PIT release with the built-in history files; 1.23+ moved incremental analysis to the
    // commercial arcmutate plugin and fails when `withHistory` is set.
    pitestVersion = '1.22.1'
    junit5PluginVersion = '1.2.3'

    targetClasses = ['com.darchan.physical.*', 'com.darchan.behavioral.*', 'com.darchan.diag.*', 'com.darchan.cosim.*']
    // all tests, including project.AppTest (it drives App end to end), may kill a mutant
    targetTests = ['com.darchan.*', 'project.*']

    // `slow` (8080EXM, ~24 billion emulated cycles) cannot run once per mutant; `mutation-skip` is CPUTEST
    // (255 M cycles, ~2 s per run, and a mutant that loops makes it run to its cycle budget). The fast CP/M
    // diagnostics (8080PRE, TST8080) and the exhaustive ALU/opcode tests stay in: every other test is < 2 s.
    excludedGroups = ['slow', 'mutation-skip']

    // DEFAULTS is PIT's standard set: invert negatives, math, void-method calls, conditional boundary, increments,
    // the return-value mutators and "replace a conditional by false" (REMOVE_CONDITIONALS_*_ELSE). STRONGER adds
    // the switch mutator and "replace a conditional by true" (REMOVE_CONDITIONALS_*_IF), roughly doubling the
    // conditional mutants and the run time. `./gradlew pitest -PpitMutators=STRONGER` runs it.
    mutators = [providers.gradleProperty('pitMutators').getOrElse('DEFAULTS')]
    // System.Logger calls only produce log text; mutating them is noise
    avoidCallsTo = ['java.lang.System$Logger', 'java.util.logging', 'org.slf4j']

    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false

    // Incremental reruns: results of unchanged classes/tests are reused. Kept outside build/ so `clean` keeps it;
    // delete .gradle/pitest-history.bin for a from-scratch measurement.
    withHistory = true
    historyInputLocation = layout.projectDirectory.file('.gradle/pitest-history.bin')
    historyOutputLocation = layout.projectDirectory.file('.gradle/pitest-history.bin')
}
