plugins {
    // Apply the java plugin to add support for Java
    id 'java'

    // Apply the application plugin to add support for building an application
    id 'application'

    // jacoco code coverage
    id 'jacoco'

    // intellij!
    id 'idea'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.5')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Tests tagged "slow" (e.g. the 8080EXM instruction exerciser, ~24 billion emulated cycles) are left out of
// the normal build; run them with ./gradlew slowTest
test {
    useJUnitPlatform {
        excludeTags 'slow'
    }
}

tasks.register('slowTest', Test) {
    description = 'Runs the long-running tests tagged "slow".'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
    }
    shouldRunAfter test
}

// Define the main class for the application
application {
    mainClass = 'project.App'
}
