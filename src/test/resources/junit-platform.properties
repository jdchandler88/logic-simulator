# Run test classes annotated with @Order first (CpmRomTest), so the timed CP/M diagnostics are JIT-compiled
# before test doubles (extra MemoryBus/DebugTarget implementations) can make the CPU's call sites megamorphic.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

# jqwik (property-based tests; its engine runs next to Jupiter on the JUnit Platform)
# keep the failure database (seeds of failed properties, retried first on the next run) under build/ so it is
# cleaned with the build and never lands in the working tree
jqwik.database=build/jqwik-database
# print only failed properties instead of a statistics block per passing one
jqwik.reporting.onlyfailures=true
